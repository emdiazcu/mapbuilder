services:

  app:
    image: emdiaz08/mapbuilder-app:latest
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: emdiaz08/mapbuilder-nginx:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mapbuilder_db
      POSTGRES_USER:     mapbuilder
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapbuilder -d mapbuilder_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  postgres_data:
