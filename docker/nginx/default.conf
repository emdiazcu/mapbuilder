server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # ── Laravel API ─────────────────────────────────────────────────────────
    # Requests to /api/* and /sanctum/* are forwarded to PHP-FPM.
    # Laravel's index.php is always the entry point.
    location ~ ^/(api|sanctum)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTPS           off;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Laravel storage files ────────────────────────────────────────────────
    # Uploaded/generated files are stored in the named volume mounted at
    # /var/www/html/storage. We serve app/public directly to avoid the symlink.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Static assets (JS/CSS/fonts from Vite build) ─────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React SPA ────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
